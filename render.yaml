services:
  - type: web
    name: kh1-predictor
    env: python
    plan: free
    pythonVersion: "3.11"
    # Build-time: install deps, then scrape every article and extract activities
    # into data/news.db, and pull the official game database into
    # data/gamedata.db.  Both DBs live inside Render's build artifact, so they
    # survive container sleep/wake cycles until the next deploy.  A gamedata
    # fetch failure is logged and skipped rather than failing the build.
    buildCommand: |
      pip install -r requirements.txt
      python -m src.scraper
      python -m src.extractor
      python -m src.gamedata
      python -m src.restore_feedback
    # Runtime: gunicorn (production WSGI), single worker is plenty for free tier
    # (limited to 0.1 CPU / 512MB).  Threads handle concurrent requests cheaply.
    startCommand: gunicorn --workers 1 --threads 4 --timeout 90 --bind 0.0.0.0:$PORT src.app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONIOENCODING
        value: utf-8
      # Set ADMIN_TOKEN in Render Dashboard (Environment tab).  When unset, the
      # /admin/feedback endpoint returns 404 — admin features stay disabled.
      - key: ADMIN_TOKEN
        sync: false
